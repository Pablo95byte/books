<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#f5f1e8"/>

  <!-- Decorative corner ornaments -->
  <path d="M 80 80 L 120 80 L 120 82 L 82 82 L 82 120 L 80 120 Z" fill="#c9a962" opacity="0.6"/>
  <path d="M 432 80 L 392 80 L 392 82 L 430 82 L 430 120 L 432 120 Z" fill="#c9a962" opacity="0.6"/>
  <path d="M 80 432 L 120 432 L 120 430 L 82 430 L 82 392 L 80 392 Z" fill="#c9a962" opacity="0.6"/>
  <path d="M 432 432 L 392 432 L 392 430 L 430 430 L 430 392 L 432 392 Z" fill="#c9a962" opacity="0.6"/>

  <!-- Book shadow -->
  <ellipse cx="256" cy="420" rx="140" ry="15" fill="#3e2723" opacity="0.15"/>

  <!-- Book -->
  <g transform="translate(256, 256)">
    <!-- Book spine -->
    <path d="M -80 -140 L -70 -135 L -70 135 L -80 140 Z" fill="#6d4423"/>

    <!-- Left page -->
    <path d="M -70 -135 L -5 -150 L -5 150 L -70 135 Z" fill="#8b5a2b"/>
    <path d="M -70 -135 L -5 -150 L -5 -148 L -70 -133 Z" fill="#daa520" opacity="0.3"/>

    <!-- Right page (lighter) -->
    <path d="M -5 -150 L 70 -135 L 70 135 L -5 150 Z" fill="#a0764d"/>
    <path d="M -5 -150 L 70 -135 L 70 -133 L -5 -148 Z" fill="#daa520" opacity="0.5"/>

    <!-- Book cover edge -->
    <path d="M 70 -135 L 80 -130 L 80 130 L 70 135 Z" fill="#c9a962"/>

    <!-- Page details on left -->
    <line x1="-60" y1="-120" x2="-15" y2="-130" stroke="#f5f1e8" stroke-width="1.5" opacity="0.3"/>
    <line x1="-60" y1="-100" x2="-15" y2="-110" stroke="#f5f1e8" stroke-width="1.5" opacity="0.3"/>
    <line x1="-60" y1="-80" x2="-15" y2="-90" stroke="#f5f1e8" stroke-width="1.5" opacity="0.3"/>

    <!-- Page details on right -->
    <line x1="10" y1="-130" x2="60" y2="-120" stroke="#f4ecd8" stroke-width="1.5" opacity="0.4"/>
    <line x1="10" y1="-110" x2="60" y2="-100" stroke="#f4ecd8" stroke-width="1.5" opacity="0.4"/>
    <line x1="10" y1="-90" x2="60" y2="-80" stroke="#f4ecd8" stroke-width="1.5" opacity="0.4"/>
    <line x1="10" y1="-70" x2="60" y2="-60" stroke="#f4ecd8" stroke-width="1.5" opacity="0.4"/>

    <!-- Bookmark ribbon -->
    <path d="M 20 -135 L 30 -135 L 30 -50 L 25 -55 L 20 -50 Z" fill="#7c3238" opacity="0.8"/>
    <path d="M 20 -135 L 30 -135 L 30 -130 L 20 -130 Z" fill="#6b2737"/>
  </g>

  <!-- Decorative gold line top -->
  <line x1="100" y1="100" x2="412" y2="100" stroke="#daa520" stroke-width="2" opacity="0.3"/>
  <!-- Decorative gold line bottom -->
  <line x1="100" y1="412" x2="412" y2="412" stroke="#daa520" stroke-width="2" opacity="0.3"/>
</svg>
